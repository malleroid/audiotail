[package]
name = "audiotail"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Stream the audio of selected macOS apps to stdout as PCM"
repository = "https://github.com/malleroid/audiotail"
license = "MIT"
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "=0.29.0", default-features = false, features = ["core_audio", "dispatch", "macos_14_2"] }

[profile.release]
lto = true
strip = true
